name: KCL Book CI

env:
  CLICOLOR: 1

on:
  pull_request:

jobs:
  test:
    name: Run book tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install zoo CLI
      uses: KittyCAD/action-install-cli@main
    - name: Build tester
      run: |
        cd kcl-book-tester
        cargo build
    - name: Run tester
      env:
        ZOO_TOKEN: ${{secrets.KITTYCAD_API_TOKEN}}
      run: |
        ./kcl-book-tester/target/debug/kcl-book-tester . all

  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.32.0

  check:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain versions
        id: versions
        run: |
          . ./scripts/versions.sh
          echo "mdbook=$MDBOOK_VERSION" >> "$GITHUB_OUTPUT"
      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ steps.versions.outputs.mdbook }}
      - name: Test markdown artifact builder
        run: node scripts/build-markdown-artifacts.test.mjs
      - run: |
          cd kcl-book
          mdbook build
      - name: Build markdown artifacts
        run: node scripts/build-markdown-artifacts.mjs
      - name: Check markdown artifacts
        run: test -f kcl-book/book/__docs-markdown/docs/kcl-book/installation.html/index.md

